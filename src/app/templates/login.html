{% extends "base.html" %}
{% block title %}Sign in — Fitness Agent{% endblock %}
{% block body %}
<div class="login-wrap">
  <form class="login-box" method="post" action="{{ base }}/login">
    <h2 style="margin:.2rem 0 .6rem;">Fitness Agent</h2>
    <p class="error">{{ error or "" }}</p>
    <input type="password" name="passphrase" placeholder="Passphrase" autofocus
           autocomplete="current-password" inputmode="text" required>
    <button type="submit">Enter</button>
  </form>
</div>
{% endblock %}
