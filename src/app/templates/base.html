<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0d0d13">
  <link rel="manifest" href="{{ base }}/manifest.webmanifest">
  <link rel="icon" href="{{ base }}/static/icons/icon.svg?v={{ v }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ base }}/static/icons/icon-192.png?v={{ v }}">
  <title>{% block title %}Fitness Agent{% endblock %}</title>
  <script src="{{ base }}/static/vendor/htmx.min.js?v={{ v }}"></script>
  <style>
    :root {
      --bg:#101014; --panel:#17171d; --panel2:#1c1c24; --border:#28282f;
      --text:#ededf0; --muted:#8f8f9c;
      --accent:#0f766e; --accent-ink:#e9fbf7;
      --ok:#34d399; --bad:#fb7185;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; flex-direction: column;
      height: 100dvh;
    }
    a { color: var(--accent); }
    .topbar {
      padding: .7rem 1rem; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      font-weight: 600; letter-spacing: .01em;
    }
    .brand { display: flex; align-items: center; gap: .55rem; }
    .brand img { width: 22px; height: 22px; display: block; }
    .topbar form { margin: 0; }
    .topbar button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: .85rem; }
    .topbar button:hover { color: var(--text); }
    #thread {
      flex: 1 1 auto; overflow-y: auto; padding: 1.1rem 1rem;
      display: flex; flex-direction: column; gap: .7rem;
    }
    .bubble {
      max-width: 82%; padding: .55rem .85rem; border-radius: 14px; line-height: 1.45;
      white-space: pre-wrap; word-wrap: break-word;
      animation: fade .16s ease-out;
    }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
    .assistant { align-self: flex-start; background: var(--panel2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .assistant.err { border-color: var(--bad); color: #ffd7dd; }
    .note { align-self: center; color: var(--muted); font-size: .85rem; text-align: center; }
    .card {
      align-self: flex-start; background: var(--panel); border: 1px solid var(--border);
      border-radius: 14px; padding: .8rem .85rem; max-width: 100%; width: 100%;
      animation: fade .16s ease-out;
    }
    .card h4 { margin: 0 0 .5rem; font-size: .95rem; font-weight: 600; }
    .card .meta { color: var(--muted); font-size: .8rem; margin-bottom: .5rem; }
    .card input, .card select {
      background: var(--panel2); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px; padding: .22rem .4rem; font-size: .85rem;
      max-width: 100%;
    }
    .card input:focus, .card select:focus { outline: none; border-color: var(--accent); }
    .tablewrap { overflow-x: auto; margin: 0 -.85rem; padding: 0 .85rem; }
    table { border-collapse: collapse; width: 100%; font-size: .82rem; }
    th, td { text-align: left; padding: .28rem .4rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; white-space: nowrap; }
    .card-actions { display: flex; gap: .5rem; margin-top: .75rem; }
    .btn {
      border: 0; border-radius: 10px; padding: .5rem 1rem; font-size: .9rem;
      cursor: pointer; font-weight: 600; transition: filter .12s, transform .06s;
    }
    .btn:hover { filter: brightness(1.06); }
    .btn:active { transform: translateY(1px); }
    .btn.ok { background: var(--accent); color: var(--accent-ink); }
    .btn.bad { background: none; color: var(--muted); border: 1px solid var(--border); }
    .btn.bad:hover { color: var(--text); border-color: var(--muted); filter: none; }
    .composer {
      display: flex; gap: .5rem; align-items: flex-end; padding: .7rem;
      border-top: 1px solid var(--border); background: var(--bg);
      padding-bottom: calc(.7rem + env(safe-area-inset-bottom));
    }
    .composer textarea {
      flex: 1; padding: .6rem .9rem; border-radius: 18px; border: 1px solid var(--border);
      background: var(--panel2); color: var(--text); font-size: 1rem; font-family: inherit;
      line-height: 1.4; resize: none; overflow-y: auto; max-height: 40vh;
    }
    .composer textarea:focus { outline: none; border-color: var(--accent); }
    .composer textarea::placeholder { color: var(--muted); }
    .send-btn {
      flex: 0 0 auto; width: 42px; height: 42px; border-radius: 50%; border: 0;
      background: var(--accent); color: var(--accent-ink); cursor: pointer;
      display: grid; place-items: center; transition: filter .12s, transform .06s;
    }
    .send-btn:hover { filter: brightness(1.06); }
    .send-btn:active { transform: scale(.94); }
    .send-btn:disabled { opacity: .55; cursor: default; }
    .send-btn svg { width: 20px; height: 20px; display: block; }
    .send-btn .send-icon { display: block; }
    .send-btn .htmx-indicator { display: none; }
    .htmx-request .send-icon { display: none; }
    .htmx-request .htmx-indicator { display: block; }
    .ring {
      width: 17px; height: 17px; border-radius: 50%;
      border: 2px solid rgba(233,251,247,.35); border-top-color: var(--accent-ink);
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* Thinking bubble — kept at the bottom of the thread while a request is in flight. */
    #thinking { align-self: flex-start; order: 9999; display: none; }
    #thinking.htmx-request { display: flex; }
    .typing { display: flex; gap: .3rem; align-items: center;
      background: var(--panel2); border: 1px solid var(--border);
      padding: .6rem .85rem; border-radius: 14px; border-bottom-left-radius: 4px; }
    .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
      display: inline-block; animation: bounce 1.2s infinite ease-in-out; }
    .typing i:nth-child(2) { animation-delay: .15s; }
    .typing i:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }
    .waiting { color: var(--muted); font-size: .78rem; margin: .3rem 0 0 .2rem; }
    .htmx-indicator { display: none; }
    .spinner { color: var(--muted); font-size: .85rem; }
    .chart { max-width: 100%; border-radius: 12px; margin-top: .4rem; border: 1px solid var(--border); background: #fff; padding: .3rem; }
    .chart svg { max-width: 100%; height: auto; display: block; }
    /* Markdown-rendered assistant replies: block markup supplies its own spacing,
       so drop the plain-text pre-wrap, and let wide tables scroll instead of
       stretching the bubble off a phone screen. */
    .bubble.md { white-space: normal; max-width: 92%; }
    .bubble.md > :first-child { margin-top: 0; }
    .bubble.md > :last-child { margin-bottom: 0; }
    .bubble.md p { margin: .35rem 0; }
    .bubble.md ul, .bubble.md ol { margin: .35rem 0; padding-left: 1.2rem; }
    .bubble.md code { background: rgba(255,255,255,.08); padding: .05rem .3rem; border-radius: 4px; font-size: .9em; }
    .bubble.md table { display: block; overflow-x: auto; white-space: nowrap; margin: .45rem 0; font-size: .8rem; }
    .bubble.md th, .bubble.md td { padding: .25rem .5rem; border-bottom: 1px solid var(--border); }
    .bubble.md th { color: var(--muted); font-weight: 600; }
    .login-wrap { flex: 1; display: flex; align-items: center; justify-content: center; }
    .login-box {
      background: var(--panel); padding: 1.9rem 1.6rem; border-radius: 16px;
      width: min(340px, 90vw); text-align: center; border: 1px solid var(--border);
    }
    .login-box h2 { margin: .2rem 0 .7rem; font-weight: 600; }
    .login-box input { width: 100%; padding: .7rem; margin: .6rem 0; border-radius: 10px; border: 1px solid var(--border); background: var(--panel2); color: var(--text); font-size: 1rem; }
    .login-box input:focus { outline: none; border-color: var(--accent); }
    .login-box button { width: 100%; padding: .75rem; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-size: 1rem; font-weight: 600; cursor: pointer; }
    .login-box button:hover { filter: brightness(1.06); }
    .error { color: var(--bad); font-size: .85rem; min-height: 1.1em; }
  </style>
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
