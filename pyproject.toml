[project]
name = "fitness-agent"
version = "0.1.0"
description = "Single-user workout logger: unstructured text → confirm card → Google Sheets, via a hand-rolled agent loop."
readme = "README.md"
# 3.11 floor: that's the newest DO Functions runtime (dev runs 3.12).
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.9",
    "gspread>=6.1",
    "google-auth>=2.35",
    "pysvgchart>=0.8",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "python-dotenv>=1.0",
    "markdown>=3.10.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py311" # deployed runtime — don't suggest 3.12-only syntax
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
